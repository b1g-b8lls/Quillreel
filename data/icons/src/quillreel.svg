  <g transform="translate(58 222) rotate(-50)">
    <path d="M 70 0 C 98 -42, 168 -66, 242 -46 C 232 -36, 224 -30, 214 -24 C 222 -24, 228 -24, 234 -26 C 214 -4, 192 8, 168 13 C 174 15, 180 16, 186 16 C 146 26, 102 16, 70 0 Z"
