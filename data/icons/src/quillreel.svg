    <rect x="44" y="-9" width="16" height="18" rx="3" fill="#24292d"/>
    <path d="M 0 0 L 44 -12 L 44 12 Z" fill="#f2b632" stroke="#8a560c" stroke-width="3" stroke-linejoin="round"/>
