# pacman configuration for installing MSYS2's UCRT64 (Windows) packages into
# /opt/msys inside the Windows packaging container (Containerfile.windows).
[options]
Architecture = any
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
CacheDir = /opt/msys/var/cache/pacman/pkg/
GPGDir = /etc/pacman.d/gnupg/

[ucrt64]
Server = https://mirror.msys2.org/mingw/ucrt64/
Server = https://repo.msys2.org/mingw/ucrt64/
